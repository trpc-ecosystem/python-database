[bumpversion]
commit = True
message = Bump version: {current_version} -> {new_version} --story=
tag = True
current_version = 0.1.0
parse = 
	(?P<major>\d+)
	\.
	(?P<minor>\d+)
	\.
	(?P<patch>\d+)
	(\-(?P<pre>[a-z]+)\.(?P<build>\d+))?
serialize = 
	{major}.{minor}.{patch}-{pre}.{build}
	{major}.{minor}.{patch}

[bumpversion:file:trpc_kafka/__init__.py]

[bumpversion:part:pre]
optional_value = release
values = 
	alpha
	beta
	rc
	release
